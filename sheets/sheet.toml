[datamodel]
id = "sheet"
version = 1
label = "Sheet"
description = "A small spreadsheet: cells in rows and columns, with numbers, text and formulas typed into them, kept exactly as typed."
domain = "sheets"
scopes = ["personal"]
title = "name"

[fields]
name = { kind = "string", required = true, indexed = true, label = "Name" }
# One entry per cell that has something in it, keyed by the cell's name,
# holding what was typed, as typed: {"A1": "Rent", "B1": "1200", "B4":
# "=SUM(B1:B3)"}. What a formula comes to is never kept; every surface
# works it out by the same rules (docs/CELLS.md in the Cloudmorrow repository).
cells = { kind = "json", label = "Cells", description = "What is typed in each cell, by its name: text, a number, or a formula starting with =" }
notes = { kind = "text", label = "Notes", description = "What the sheet is for, in a few lines" }
