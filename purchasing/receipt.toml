[datamodel]
id = "receipt"
version = 1
label = "Goods received"
description = "What arrived against a purchase order, and when: a delivery, whole or in part."
domain = "purchasing"
scopes = ["personal", "shared", "public"]
title = "what"
in_space = "book"

[fields]
book = { kind = "link", to = "book", indexed = true, on_delete = "cascade" }
purchase_order = { kind = "link", to = "purchase_order", required = true, indexed = true, on_delete = "cascade" }
what = { kind = "string", required = true }
on = { kind = "date", required = true, indexed = true }
quantity = { kind = "decimal" }
notes = { kind = "markdown" }
