[datamodel]
id = "quote_line"
version = 1
label = "Quote line"
description = "One line of a quote, as written: the words, the quantity and the price stay what they were when it was sent, whatever the catalogue says later."
domain = "invoicing"
scopes = ["personal", "shared", "public"]
title = "description"
in_space = "book"
ordered_within = ["quote"]

[fields]
book = { kind = "link", to = "book", indexed = true, on_delete = "cascade" }
quote = { kind = "link", to = "quote", required = true, indexed = true, on_delete = "cascade" }
description = { kind = "string", required = true }
quantity = { kind = "decimal", default = 1 }
unit_price = { kind = "decimal" }
tax_rate = { kind = "decimal", description = "In percent" }
amount = { kind = "decimal", indexed = true }
product = { kind = "link", to = "product", on_delete = "clear", description = "Where the line came from; the line stands on its own" }
